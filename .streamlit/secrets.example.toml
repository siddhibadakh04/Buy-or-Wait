# Copy to .streamlit/secrets.toml for local-only demo mode.
[app]
mode = "local"

# Public deployment settings:
# 1. Change mode to "public".
# 2. Create a Google OIDC web client and set its redirect URI to
#    https://YOUR-APP-URL/oauth2callback (and the local URI when testing).
# 3. Set [auth] and [auth.google] below.
# 4. Set [database].url to the restricted buy_wait_app Postgres connection.

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_WITH_GOOGLE_OIDC_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[database]
url = "postgresql://buy_wait_app:REPLACE_PASSWORD@YOUR_DB_HOST:5432/postgres"
